# ORACLE policy — data, not code.
#
# Nothing the model emits and nothing retrieved from a document can modify this file.
# It is loaded at startup and on explicit reload only, never from a tool
# (docs/SECURITY.md#2-design-principles).
#
# If this file is missing or unparseable, ORACLE starts in READ-ONLY LOCKDOWN.
# That is deliberate: a security control that fails open is not a security control.

version: 1

scopes:
  projects:
    roots:
      - { path: "C:/Projects", mode: rw }

  notes:
    roots:
      - { path: "C:/Users/qhukz/Documents/ObsidianNotes", mode: rw }
      - { path: "C:/Users/qhukz/Documents/AI/ML Learning", mode: rw }

  scratch:
    roots:
      - { path: "D:/ORACLE/scratch", mode: rw }

  # Everything not listed above is invisible. There is no implicit read of
  # C:/Users/** — Documents alone contains game saves and Paradox data.
  #
  # deny_always wins over every allow and is NOT overridable from the UI. Changing it
  # means editing this file by hand, which is the intended speed bump.
  #
  # Matched against the RESOLVED path, never the raw one: Windows strips trailing dots
  # (`.env.` opens `.env`) and 8.3 aliases (`PROGRA~1`) would otherwise dodge a rule
  # written against the long name. See logs/development/2026-08-21-oq04-windows-paths.md
  deny_always:
    - "**/.ssh/**"
    - "**/*.env"
    - "**/.git/hooks/**"      # writing a hook is code execution on the next commit
    - "**/.git/config"        # core.fsmonitor / core.pager are execution vectors
    - "**/node_modules/.bin/**"
    - "**/id_rsa*"
    - "**/*.pem"
    - "**/*.pfx"

# Programs ORACLE may spawn at all (docs/SECURITY.md#4b).
#
# Each name is pinned to an ABSOLUTE PATH once, when this file is loaded. PATH is never
# consulted at call time: it is attacker-influenceable, and on Windows the current
# directory participates in the search order, so a `git.exe` dropped into a project
# folder would otherwise win.
#
# `subcommands` is consulted only for `dev.execute`, where the model chooses the argv.
# An intent-shaped tool (`git.commit`) builds its own argv and is a promise by
# construction — that is the entire point of TOOLS.md rule 1. Both paths still get the
# argument-shape checks (NUL bytes, length, and the batch-file rule below).
#
# A subcommand nobody wrote down is DENIED. There is no implicit allow.
programs:
  git:
    subcommands:
      allow:   [status, diff, log, add, branch, stash, show, rev-parse, worktree]
      confirm: [commit, checkout, push, pull, fetch, merge, rebase, restore]
      # Not overridable from the UI. Each of these destroys work that cannot be
      # recovered from the trash, or rewrites published history.
      deny:
        - "push --force"
        - "push -f"
        - "push --force-with-lease"
        - filter-branch
        - "clean -x"
        - "reset --hard"
  # npm and uv are batch/shim targets on Windows; arguments containing characters
  # cmd.exe would reinterpret are refused outright rather than escaped, because there
  # is no correct escaping for a batch target (CVE-2024-3566).
  npm:
    subcommands:
      allow:   [test, run, ci, ls, exec]
      confirm: [install, update, build]
      deny:    [publish, login, adduser, token]
  uv:
    subcommands:
      allow:   [run, tree, version]
      confirm: [sync, add, lock]
      deny:    [publish, build]
  cargo:
    subcommands:
      allow:   [test, build, check, clippy, fmt, tree, metadata]
      confirm: [run, update]
      deny:    [publish, login, install]
  python:
    # No subcommand grammar; the argv is matched as a whole instead.
    allow_args_matching:
      - "-m pytest*"
      - "-m ruff*"
      - "-m mypy*"
      - "-m venv*"
      - "-V"
  cmd:
    # The interactive shell `term.open` starts. It is on the allowlist so the pinning
    # rule applies to it like anything else — and NOT because a shell can be inspected.
    # It cannot: that is exactly why `term.write` is T2 and confirmed every time.
    path: "C:/Windows/System32/cmd.exe"
  tasklist:
    # Declared with an absolute path so a `tasklist.exe` earlier on PATH can never be
    # the one we run. If this path is wrong on some machine the tool refuses loudly,
    # which is the correct failure.
    path: "C:/Windows/System32/tasklist.exe"

tools:
  # ------------------------------------------------------------------------ read-only
  oracle.status:      { tier: T0 }
  oracle.task_list:   { tier: T0 }
  oracle.halt:        { tier: T0 }   # stopping must never require permission

  sys.info:           { tier: T0 }
  sys.processes:      { tier: T0 }

  fs.read:
    tier: T0
    scopes: [projects, notes, scratch]

  fs.list:
    tier: T0
    scopes: [projects, notes, scratch]

  fs.stat:
    tier: T0
    scopes: [projects, notes, scratch]

  # ---------------------------------------------------------------------- mutating
  # A tool with no rule here is denied by default, so declaring one early costs nothing
  # and documents intent. A few below are still declared-but-not-built (git.reset_hard,
  # git.clean, dev.install_deps, app.close, ai.*) — kept so the tiering is reviewable
  # now rather than invented under deadline later.
  fs.write:
    tier: T1                # reversible + journalled, so it runs without prompting
    scopes: [projects, notes, scratch]

  fs.patch:
    tier: T1
    scopes: [projects, notes, scratch]

  fs.move:
    tier: T1
    scopes: [projects, notes, scratch]

  fs.delete:
    tier: T3                # moves to the trash; never an unrecoverable delete
    scopes: [projects, notes, scratch]

  git.status:  { tier: T0, scopes: [projects] }
  git.diff:    { tier: T0, scopes: [projects] }
  git.log:     { tier: T0, scopes: [projects] }
  git.add:     { tier: T1, scopes: [projects] }
  git.commit:  { tier: T1, scopes: [projects] }
  git.branch:  { tier: T1, scopes: [projects] }
  git.stash:   { tier: T1, scopes: [projects] }
  git.push:    { tier: T2, scopes: [projects] }   # visible to others, cannot be unpublished
  # Executed by the undo journal, never selectable by the model (contract: hidden).
  # Same tier as the mutations it reverses: undoing is not more privileged than doing.
  git.undo:    { tier: T1, scopes: [projects] }
  git.reset_hard: { tier: T3, scopes: [projects] }
  git.clean:      { tier: T3, scopes: [projects] }

  dev.run_tests:    { tier: T1, scopes: [projects] }
  dev.build:        { tier: T1, scopes: [projects] }
  dev.lint:         { tier: T1, scopes: [projects] }
  dev.install_deps: { tier: T2, scopes: [projects] }   # network + arbitrary postinstall
  dev.execute:      { tier: T2, scopes: [projects] }

  term.open:  { tier: T1, scopes: [projects, notes, scratch] }
  term.read:  { tier: T0, scopes: [projects, notes, scratch] }
  term.write: { tier: T2, scopes: [projects, notes, scratch] }   # typing into a live shell = full user rights
  term.close: { tier: T1, scopes: [projects, notes, scratch] }
  # The human's own keystrokes and window size, arriving from the terminal dock.
  # Hidden from the model (contract), so this tier can never be the agent's route
  # around term.write's confirmation.
  term.input:  { tier: T1, scopes: [projects, notes, scratch] }
  term.resize: { tier: T1, scopes: [projects, notes, scratch] }

  app.launch: { tier: T1, scopes: [projects, notes, scratch] }
  app.close:  { tier: T2 }

  # ------------------------------------------------------------------------- knowledge
  # No `scopes:`, and that is deliberate rather than an omission. These tools take no
  # path argument — they can only reach what a human already opted into in
  # config/collections.yaml, which is the scope. Adding `scopes: [projects, notes]`
  # here would suggest a path is being checked when none is passed.
  #
  # T0 because reading an index you asked to be built is not a side effect. What comes
  # back is another matter: every result carries `provenance`, and a result set holding
  # `local_foreign` content taints the turn and escalates any plan built on it
  # (docs/SECURITY.md#6). The tier of the *read* and the trust of the *content* are
  # separate questions, and this file only answers the first.
  know.search:       { tier: T0 }
  know.search_code:  { tier: T0 }
  know.read_context: { tier: T0 }
  # T1: it writes, but only to knowledge.db, which is disposable by design (ADR-0006).
  # A full rebuild costs about an hour of CPU, which is a reason to make it explicit in
  # the argument — not a reason to make it a confirmation.
  know.reindex:      { tier: T1 }

  ai.build_packet: { tier: T0 }                  # local only, no egress
  ai.delegate:     { tier: T2 }                  # egress; preview is mandatory
  ai.collect:      { tier: T1 }
  # The graph approval card (P8-T1). One decision covering a whole plan: the tasks are
  # listed up front with what each will do and which agent gets it. It authorises the
  # *shape* only - every delegation inside it still asks its own egress question, because
  # an egress approval binds to rendered bytes that do not exist yet (SECURITY.md §10).
  ai.graph:        { tier: T2 }
  # The pipeline approval card (P10-T4). One decision covering a whole run: every step is
  # listed with its tool, its RESOLVED arguments, its tier and the rule that priced it.
  # Approving it mints a single-use grant per elevated step, each bound to the argument
  # digest the card showed - so it authorises exactly what was displayed and nothing that
  # resembles it. T3 steps are refused at validation and never reach a card: a T3 needs a
  # phrase typed for that invocation, and batching one would make it a T2 wearing a label
  # (SECURITY.md §5).
  #
  # T0 here is a FLOOR, not a price, and the distinction is the whole rule.
  # `evaluate()` raises a tool's tier to its `declared_tier` and never lowers it, and a
  # pipeline declares `max(tier(step))` (PIPELINES.md §3). So a run containing a T2 step
  # is priced T2 and asks; a run of nothing but reads is priced T0 and asks nobody, which
  # is what "confirm actions, not intentions" means when the actions are all T0. The entry
  # exists because `default_decision: deny` means an absent pseudo-tool is a refused one -
  # it is here to make `pipe.run` KNOWN, not to fix what it costs.
  pipe.run:        { tier: T0 }

# Tools deliberately absent, and therefore denied by default:
#   oracle.set_policy   - policy changes are a human editing this file
#   git.push --force    - not exposed at all
#   registry.*, sys.settings write - the blast radius is the OS
#   keyboard/mouse synthesis - unscopeable by nature
# See docs/TOOLS.md#deliberately-absent
