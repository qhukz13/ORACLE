[project]
name = "oracle"
version = "0.0.1"
description = "ORACLE — local-first personal AI agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "structlog>=24.4",
    "httpx2>=2.12",
    "pyyaml>=6.0",
    # Windows ConPTY, for term.*. Justified in docs/TECH_STACK.md#terminal; the 3.12
    # wheel and the ConPTY behaviour were verified in OQ-09 before this was added.
    "pywinpty>=3.0.5",
    # Phase 5 knowledge index. Ledger with the rejected alternatives:
    # docs/TECH_STACK.md#phase-5-dependency-ledger. Notably NOT torch: embeddings run
    # forward-only on the CPU (ADR-0014), so a 2.5 GB CUDA-linked wheel buys nothing.
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "numpy>=2.0",
    "sqlite-vec>=0.1.9",
    # File watching for incremental indexing. Rust `notify` under the hood: chosen over
    # `watchdog` for Windows reliability (docs/TECH_STACK.md#4-knowledge).
    "watchfiles>=0.24",
    # Code chunking on a real syntax tree. One abi3 wheel for all 18 grammars this corpus
    # needs; every one verified to load here before code was written against it.
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.14",
    # PDF text layer, no OCR. Apache/BSD; PyMuPDF is AGPL and not worth that entanglement
    # for a text extractor (docs/TECH_STACK.md#4-knowledge).
    "pypdfium2>=5.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-pyyaml>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "hypothesis>=6.100",
    "pytest-timeout>=2.4.0",
]

[project.scripts]
oracled = "oracle.api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
# S101 assert-in-tests is fine; S608 not relevant (no user SQL).
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Russian test fixtures are the point, not an ambiguity (RUF001).
"tests/*" = ["S105", "S106", "RUF001"]
# The security suite must build REAL junctions with mklink; a mocked reparse point
# would encode the very assumption the suite exists to disprove.
"tests/security/*" = ["S105", "S106", "RUF001", "S603", "S607", "ASYNC221", "ASYNC240"]
# Delegation tests assert on workspace paths after awaiting the service; the Path
# calls are on tmp dirs and the suite is not trio/anyio.
"tests/test_delegation_service.py" = ["ASYNC240"]
# Few-shot examples are literal prompt content, not code. Wrapping them would change
# what the model sees, and RUF001 flags Cyrillic as "ambiguous" in what is deliberately
# a bilingual prompt.
"src/oracle/router/intent.py" = ["E501", "RUF001"]
# Same reasoning as intent.py: the few-shot block is literal prompt content, not code.
# Reflowing it would change what the model sees, and RUF001 flags Cyrillic as
# "ambiguous" in what is deliberately a bilingual prompt.
"src/oracle/router/selection.py" = ["E501", "RUF001"]
"scripts/*" = ["E501"]
# A one-shot CLI, not the daemon: an async main that touches Path is fine here, and
# the alternative is threading every stat call in a script that runs once by hand.
"scripts/verify_mcp_live.py" = ["E501", "ASYNC240"]
# ASYNC250: the egress confirmation is a blocking `input()` inside an async main, and
# that is the point — nothing else may proceed while a human decides whether ~20 planning
# calls leave the machine. Same one-shot-CLI reasoning as verify_mcp_live.py above.
"scripts/verify_agy_planning.py" = ["E501", "ASYNC240", "ASYNC250"]
# Same one-shot-CLI reasoning: it reads the fixture file and writes one JSON result from
# an async main, and there is no event loop with anything else on it to starve.
"scripts/translate_fixtures.py" = ["E501", "ASYNC240"]
# ASYNC240: tool handlers do blocking file I/O on purpose. They execute inside the
# toolhost child, which handles exactly one invocation at a time and has no event loop
# to starve (ADR-0003). Making them async-file-aware would add noise to every handler
# to protect a loop that has nothing else to run.
#
# NOTE: this reasoning holds only for the toolhost path. `ToolExecutor(host=None)` runs
# handlers in-process and IS exposed to this; it exists for tests and as a degraded
# fallback, and is documented as such in executor.py.
"src/oracle/tools/readonly.py" = ["ASYNC240"]
"src/oracle/tools/filesystem.py" = ["ASYNC240"]
"src/oracle/tools/git.py" = ["ASYNC240"]
"src/oracle/tools/dev.py" = ["ASYNC240"]
# ASYNC220: `app.launch` uses Popen deliberately. There is nothing to await — the
# process is detached and outlives the call by design — and `create_subprocess_exec`
# would register a child watcher for a process we are never going to reap.
"src/oracle/tools/apps.py" = ["ASYNC240", "ASYNC220"]
"src/oracle/tools/terminal.py" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/oracle"]
# aiosqlite/structlog ship types; keep this empty and revisit if it grows.
warn_unused_ignores = true

# It grew, twice, on 2026-08-22. `onnxruntime` ships no py.typed marker and no stubs;
# `sqlite_vec` is a loader for a C extension; `pypdfium2` is a ctypes binding to pdfium.
# `tokenizers`, `numpy` and `tree_sitter` do ship types and are deliberately absent from
# this list — the exemption is per-package, not a blanket one, so a package that starts
# shipping types stops being exempt.
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "sqlite_vec.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
# A hang under a CPU-starved gate run is expensive to bisect (one hung on 2026-08-26,
# passed on retry). 120 s is far above any legitimate test — the slowest, the
# terminal/recovery ones, finish well under 60 s — so this only converts hangs into
# failures with a name. timeout_method stays unset: the plugin defaults to the thread
# method on Windows, and the signal method does not exist here.
timeout = 120
