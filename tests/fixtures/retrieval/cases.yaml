  # ---- Russian, expanded 2026-08-22 (P5-T2 requirement 6) -----------------
  #
  # The original eight RU rows could not carry a model decision: at n=8 a single
  # case is 12.5 points, and `bge-m3` beat `e5-base` by an amount smaller than
  # that. These seventeen take the Russian set to 25.
  #
  # Ground truth was read, not retrieved: each source file was opened and its
  # leading comment or implementation checked against the question. Deriving
  # fixtures from the system they measure produces a set that agrees with
  # whatever the system already does.
  #
  # Chosen for *spread*, not difficulty. Every one names a subsystem no other
  # fixture touches, so a model cannot score by being good at one corner of the
  # corpus, and the questions are phrased the way the question would actually
  # be asked rather than as keyword bait.

  - id: ru-pairing-bruteforce
