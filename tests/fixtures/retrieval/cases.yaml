# Retrieval fixture set — RAG.md §8.
#
# ~20 real questions with known-correct sources. The gate is recall@5 >= 80%:
# for at least 16 of these, one of `expect_any` must appear in the top 5 chunks.
#
# Ground truth was established by reading the files, not by running retrieval and
# recording what came back — a fixture set derived from the system it measures is
# a tautology. Paths are relative to the corpus root of the collection named in
# `collection` (`projects` roots at C:/Projects, `notes` at the vault roots).
#
# `lang` is the language of the QUESTION, not of the source. The RU→EN rows are
# the point of the set: a Russian question against an English codebase is the case
# that regresses silently, and it is why OQ-02 existed.
#
# `kind`:
#   semantic   — conceptual; a dense model should win
#   lexical    — an identifier or filename; BM25 should win, dense usually fails
#   crosslang  — Russian question, English source
#
# Used by: scripts/eval_embeddings.py (OQ-02) and the retrieval quality gate.

cases:
  # ---- Russian question, English codebase: the hard case ------------------
  - id: ru-token-refresh
    q: "как работает refresh токена в Asterim"
    lang: ru
    kind: crosslang
    collection: projects
    expect_any: ["Asterim/apps/server/src/services/TokenService.ts"]

